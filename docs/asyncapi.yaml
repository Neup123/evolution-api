  schemas:
    Jid:
      type: string
      description: WhatsApp JID. Common suffixes are @s.whatsapp.net (phone), @lid (linked identity), @g.us (group),
        @newsletter, and @broadcast.
      examples:
        - 120363000000000000@g.us
    MessageKey:
      type: object
      required:
        - remoteJid
        - id
        - fromMe
      properties:
        remoteJid:
          $ref: "#/components/schemas/Jid"
        remoteJidAlt:
          $ref: "#/components/schemas/Jid"
        id:
          type: string
          description: WhatsApp message ID. Use this as the primary idempotency key together with remoteJid.
        fromMe:
          type: boolean
          description: True when the connected account sent the message.
        participant:
          $ref: "#/components/schemas/Jid"
        participantAlt:
          $ref: "#/components/schemas/Jid"
      additionalProperties: true
    MessageContent:
      type: object
      description: Exactly one principal message variant is normally present. Wrapper variants such as ephemeralMessage and
        viewOnceMessage contain another message object.
      properties:
        conversation:
          type: string
          description: Plain text message.
        extendedTextMessage:
          type: object
          properties:
            text:
              type: string
            contextInfo:
              type: object
              additionalProperties: true
          additionalProperties: true
        imageMessage:
          $ref: "#/components/schemas/MediaMessage"
        videoMessage:
          $ref: "#/components/schemas/MediaMessage"
        audioMessage:
          $ref: "#/components/schemas/MediaMessage"
        documentMessage:
          $ref: "#/components/schemas/MediaMessage"
        stickerMessage:
          $ref: "#/components/schemas/MediaMessage"
        contactMessage:
          type: object
          properties:
            displayName:
              type: string
            vcard:
              type: string
          additionalProperties: true
        contactsArrayMessage:
          type: object
          additionalProperties: true
        locationMessage:
          $ref: "#/components/schemas/LocationMessage"
        liveLocationMessage:
          $ref: "#/components/schemas/LocationMessage"
        reactionMessage:
          type: object
          properties:
            key:
              $ref: "#/components/schemas/MessageKey"
            text:
              type: string
              description: Emoji; empty means reaction removed.
          additionalProperties: true
        pollCreationMessage:
          type: object
          additionalProperties: true
        pollUpdateMessage:
          type: object
          additionalProperties: true
        buttonsResponseMessage:
          type: object
          additionalProperties: true
        listResponseMessage:
          type: object
          additionalProperties: true
        templateButtonReplyMessage:
          type: object
          additionalProperties: true
        interactiveResponseMessage:
          type: object
          additionalProperties: true
        protocolMessage:
          type: object
          description: Protocol action such as edit, revoke, or history sync.
          additionalProperties: true
        editedMessage:
          type: object
          properties:
            message:
              $ref: "#/components/schemas/MessageContent"
          additionalProperties: true
        ephemeralMessage:
          type: object
          properties:
            message:
              $ref: "#/components/schemas/MessageContent"
          additionalProperties: true
        viewOnceMessage:
          type: object
          properties:
            message:
              $ref: "#/components/schemas/MessageContent"
          additionalProperties: true
        viewOnceMessageV2:
          type: object
          properties:
            message:
              $ref: "#/components/schemas/MessageContent"
          additionalProperties: true
      additionalProperties: true
    MediaMessage:
      type: object
      properties:
        url:
          type: string
          description: Temporary media URL when supplied by WhatsApp.
        mimetype:
          type: string
        caption:
          type: string
        fileName:
          type: string
        fileLength:
          oneOf:
            - type: integer
            - type: string
          description: May serialize as a number or Long-compatible string.
        seconds:
          type: integer
        ptt:
          type: boolean
          description: True for a voice note.
        mediaKey:
          type: string
          format: byte
        directPath:
          type: string
        jpegThumbnail:
          type: string
          format: byte
        base64:
          type: string
          format: byte
          description: Present only when webhook base64 delivery is enabled and Evolution prepared media data.
      additionalProperties: true
    LocationMessage:
      type: object
      properties:
        degreesLatitude:
          type: number
        degreesLongitude:
          type: number
        name:
          type: string
        address:
          type: string
      additionalProperties: true
    Message:
      type: object
      required:
        - key
      properties:
        key:
          $ref: "#/components/schemas/MessageKey"
        pushName:
          type:
            - string
            - "null"
          description: Sender display name when known.
        message:
          $ref: "#/components/schemas/MessageContent"
        messageType:
          type: string
          description: Evolution-derived principal message type, for example conversation, imageMessage, or reactionMessage.
        messageTimestamp:
          oneOf:
            - type: integer
            - type: string
          description: Unix time in seconds; large protobuf Long values may serialize as strings.
        status:
          type:
            - string
            - "null"
          enum:
            - ERROR
            - PENDING
            - SERVER_ACK
            - DELIVERY_ACK
            - READ
            - DELETED
            - PLAYED
            - EDITED
            - null
        source:
          type: string
        contextInfo:
          type: object
          additionalProperties: true
        instanceId:
          type: string
          description: Evolution database instance ID when the event was prepared for persistence.
      additionalProperties: true
    MessageArray:
      type: array
      items:
        $ref: "#/components/schemas/Message"
    MessageUpdate:
      type: object
      required:
        - key
      properties:
        key:
          $ref: "#/components/schemas/MessageKey"
        status:
          type:
            - string
            - "null"
          enum:
            - ERROR
            - PENDING
            - SERVER_ACK
            - DELIVERY_ACK
            - READ
            - DELETED
            - PLAYED
            - EDITED
            - null
        update:
          type: object
          description: Raw Baileys update fields.
          additionalProperties: true
        message:
          type: object
          description: Evolution normalized update when available.
          additionalProperties: true
        messageId:
          type: string
          description: Evolution database message ID when found.
        instanceId:
          type: string
      additionalProperties: true
    Contact:
      type: object
      required:
        - remoteJid
      properties:
        remoteJid:
          $ref: "#/components/schemas/Jid"
        pushName:
          type:
            - string
            - "null"
        profilePicUrl:
          type:
            - string
            - "null"
          format: uri
        instanceId:
          type: string
      additionalProperties: true
    ContactArray:
      type: array
      items:
        $ref: "#/components/schemas/Contact"
    Chat:
      type: object
      required:
        - remoteJid
      properties:
        remoteJid:
          $ref: "#/components/schemas/Jid"
        name:
          type:
            - string
            - "null"
        unreadMessages:
          type: integer
        instanceId:
          type: string
      additionalProperties: true
    ChatArray:
      type: array
      items:
        $ref: "#/components/schemas/Chat"
    Presence:
      type: object
      required:
        - id
        - presences
      properties:
        id:
          $ref: "#/components/schemas/Jid"
        presences:
          type: object
          additionalProperties:
            type: object
            properties:
              lastKnownPresence:
                type: string
                enum:
                  - unavailable
                  - available
                  - composing
                  - recording
                  - paused
              lastSeen:
                type: integer
                description: Unix timestamp in seconds.
              groupOnlineCount:
                type: integer
            additionalProperties: true
    GroupParticipant:
      type: object
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/Jid"
        phoneNumber:
          type: string
          description: Resolved phone number when available.
        name:
          type: string
        imgUrl:
          type:
            - string
            - "null"
          format: uri
        admin:
          type:
            - string
            - "null"
          enum:
            - admin
            - superadmin
            - null
        isAdmin:
          type: boolean
        isSuperAdmin:
          type: boolean
      additionalProperties: true
    GroupMetadata:
      type: object
      required:
        - id
        - subject
      properties:
        id:
          $ref: "#/components/schemas/Jid"
        subject:
          type: string
        owner:
          $ref: "#/components/schemas/Jid"
        addressingMode:
          type: string
          enum:
            - lid
            - pn
        desc:
          type: string
        linkedParent:
          $ref: "#/components/schemas/Jid"
        restrict:
          type: boolean
        announce:
          type: boolean
        memberAddMode:
          type: boolean
        joinApprovalMode:
          type: boolean
        isCommunity:
          type: boolean
        isCommunityAnnounce:
          type: boolean
        size:
          type: integer
        participants:
          type: array
          items:
            $ref: "#/components/schemas/GroupParticipant"
        ephemeralDuration:
          type: integer
      additionalProperties: true
    GroupMetadataArray:
      type: array
      items:
        $ref: "#/components/schemas/GroupMetadata"
    GroupParticipantsUpdate:
      type: object
      required:
        - id
        - participants
        - action
      properties:
        id:
          $ref: "#/components/schemas/Jid"
        participants:
          type: array
