      operationId: receiveRemoveInstance
      summary: Instance removed from the running monitor
      message:
        $ref: "#/components/messages/REMOVE_INSTANCE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
