  /logout-instance:
    description: Instance logged out. This suffix is appended only when webhook-by-event is enabled. Without that option,
      all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveLogoutInstance
      summary: Instance logged out
      message:
        $ref: "#/components/messages/LOGOUT_INSTANCE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Lifecycle
components:
  messages:
    APPLICATION_STARTUP:
      messageId: APPLICATION_STARTUP
      name: application.startup
      title: Server application started
      summary: Global webhook event; it may not be associated with a connected instance.
