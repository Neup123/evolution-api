asyncapi: 2.6.0
id: https://github.com/Neup123/evolution-api/docs/asyncapi.yaml
info:
  title: Evolution API Webhook Events
  version: 2.3.7-baileys-7.0.0-rc14
  description: >-
    Consumer-facing contract for webhook HTTP POST requests emitted by this Evolution API fork.


    The documented payload is the complete HTTP body received by n8n. `data` varies by event. Schemas intentionally
    allow additional Baileys/protobuf fields so compatible upstream additions do not break consumers.


    When webhook-by-event is disabled, every message is posted to the configured URL. When enabled, Evolution appends
    the kebab-case suffix shown as the channel address.
  contact:
    name: Neup123 Evolution API fork
    url: https://github.com/Neup123/evolution-api
    email: Neup123@users.noreply.github.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/json
servers:
  webhookReceiver:
    url: n8n.example/webhook/evolution
    protocol: https
    description: Your configured webhook base URL. Replace this example with the n8n production URL.
    security: []
channels:
  /application-startup:
    description: Server application started. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveApplicationStartup
      summary: Server application started
      description: Global webhook event; it may not be associated with a connected instance.
      message:
        $ref: "#/components/messages/APPLICATION_STARTUP"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Lifecycle
  /instance-create:
    description: Instance created. This suffix is appended only when webhook-by-event is enabled. Without that option, all
      event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveInstanceCreate
      summary: Instance created
      message:
        $ref: "#/components/messages/INSTANCE_CREATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Lifecycle
  /instance-delete:
    description: Instance deleted. This suffix is appended only when webhook-by-event is enabled. Without that option, all
      event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveInstanceDelete
      summary: Instance deleted
      message:
        $ref: "#/components/messages/INSTANCE_DELETE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Lifecycle
  /qrcode-updated:
    description: QR or pairing code changed. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveQrcodeUpdated
      summary: QR or pairing code changed
      message:
        $ref: "#/components/messages/QRCODE_UPDATED"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Connection
  /connection-update:
    description: WhatsApp connection state changed. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveConnectionUpdate
      summary: WhatsApp connection state changed
      message:
        $ref: "#/components/messages/CONNECTION_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Connection
  /status-instance:
    description: Evolution instance status changed. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveStatusInstance
      summary: Evolution instance status changed
      message:
        $ref: "#/components/messages/STATUS_INSTANCE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Connection
  /messages-set:
    description: Historical messages batch prepared. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessagesSet
      summary: Historical messages batch prepared
      description: "`isLatest` and `progress` can also appear at envelope level."
      message:
        $ref: "#/components/messages/MESSAGES_SET"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Messages
  /messages-upsert:
    description: One new or newly synchronized message. This suffix is appended only when webhook-by-event is enabled.
      Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessagesUpsert
      summary: One new or newly synchronized message
      description: Evolution emits one prepared message per HTTP delivery, not the Baileys `{ messages, type }` batch.
      message:
        $ref: "#/components/messages/MESSAGES_UPSERT"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Messages
  /messages-edited:
    description: Message edit protocol action received. This suffix is appended only when webhook-by-event is enabled.
      Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessagesEdited
      summary: Message edit protocol action received
      message:
        $ref: "#/components/messages/MESSAGES_EDITED"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Messages
  /messages-update:
    description: Message status or content updated. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessagesUpdate
      summary: Message status or content updated
      message:
        $ref: "#/components/messages/MESSAGES_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Messages
  /messages-delete:
    description: Message or chat messages deleted. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessagesDelete
      summary: Message or chat messages deleted
      description: Shape depends on whether deletion came from a WhatsApp update or an Evolution API delete operation.
      message:
        $ref: "#/components/messages/MESSAGES_DELETE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Messages
  /send-message:
    description: Evolution sent a message. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveSendMessage
      summary: Evolution sent a message
      message:
        $ref: "#/components/messages/SEND_MESSAGE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Messages
  /send-message-update:
    description: A sent message edit was confirmed. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveSendMessageUpdate
      summary: A sent message edit was confirmed
      message:
        $ref: "#/components/messages/SEND_MESSAGE_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Messages
  /contacts-set:
    description: Initial contacts batch. This suffix is appended only when webhook-by-event is enabled. Without that option,
      all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveContactsSet
      summary: Initial contacts batch
      description: Retained for compatibility; Baileys 7 does not currently emit contacts.set.
      message:
        $ref: "#/components/messages/CONTACTS_SET"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Contacts
  /contacts-upsert:
    description: Contacts inserted or replaced. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveContactsUpsert
      summary: Contacts inserted or replaced
      message:
        $ref: "#/components/messages/CONTACTS_UPSERT"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Contacts
  /contacts-update:
    description: Contacts changed. This suffix is appended only when webhook-by-event is enabled. Without that option, all
      event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveContactsUpdate
      summary: Contacts changed
      message:
        $ref: "#/components/messages/CONTACTS_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Contacts
  /presence-update:
    description: Typing, recording, online, or unavailable presence changed. This suffix is appended only when
      webhook-by-event is enabled. Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receivePresenceUpdate
      summary: Typing, recording, online, or unavailable presence changed
      message:
        $ref: "#/components/messages/PRESENCE_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Contacts
  /chats-set:
    description: Initial/history chats batch prepared. This suffix is appended only when webhook-by-event is enabled.
      Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveChatsSet
      summary: Initial/history chats batch prepared
      message:
        $ref: "#/components/messages/CHATS_SET"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Chats
  /chats-upsert:
    description: Chats inserted or replaced. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveChatsUpsert
      summary: Chats inserted or replaced
      message:
        $ref: "#/components/messages/CHATS_UPSERT"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Chats
  /chats-update:
    description: Chats changed. This suffix is appended only when webhook-by-event is enabled. Without that option, all
      event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveChatsUpdate
      summary: Chats changed
      message:
        $ref: "#/components/messages/CHATS_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Chats
  /chats-delete:
    description: Chats deleted. This suffix is appended only when webhook-by-event is enabled. Without that option, all
      event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveChatsDelete
      summary: Chats deleted
      message:
        $ref: "#/components/messages/CHATS_DELETE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Chats
  /groups-upsert:
    description: Group metadata inserted or replaced. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveGroupsUpsert
      summary: Group metadata inserted or replaced
      message:
        $ref: "#/components/messages/GROUPS_UPSERT"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Groups
  /groups-update:
    description: Group metadata changed. This suffix is appended only when webhook-by-event is enabled. Without that option,
      all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveGroupsUpdate
      summary: Group metadata changed
      message:
        $ref: "#/components/messages/GROUPS_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Groups
  /group-participants-update:
    description: Group members added, removed, promoted, demoted, or modified. This suffix is appended only when
      webhook-by-event is enabled. Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveGroupParticipantsUpdate
      summary: Group members added, removed, promoted, demoted, or modified
      message:
        $ref: "#/components/messages/GROUP_PARTICIPANTS_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Groups
  /group-join-request:
    description: Group join request created, revoked, or rejected. This suffix is appended only when webhook-by-event is
      enabled. Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveGroupJoinRequest
      summary: Group join request created, revoked, or rejected
      description: "`action`: created, revoked, or rejected. `method`: invite_link, linked_group_join, or non_admin_add."
      message:
        $ref: "#/components/messages/GROUP_JOIN_REQUEST"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Groups
  /group-member-tag-update:
    description: Group member tag/label changed. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveGroupMemberTagUpdate
      summary: Group member tag/label changed
      message:
        $ref: "#/components/messages/GROUP_MEMBER_TAG_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Groups
  /call:
    description: Call state changed. This suffix is appended only when webhook-by-event is enabled. Without that option, all
      event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveCall
      summary: Call state changed
      message:
        $ref: "#/components/messages/CALL"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Calls
  /typebot-start:
    description: Typebot session started. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveTypebotStart
      summary: Typebot session started
      message:
        $ref: "#/components/messages/TYPEBOT_START"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Chatbots
  /typebot-change-status:
    description: Typebot session status changed. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveTypebotChangeStatus
      summary: Typebot session status changed
      description: Fields vary with the Typebot integration transition that emitted the event.
      message:
        $ref: "#/components/messages/TYPEBOT_CHANGE_STATUS"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Chatbots
  /labels-edit:
    description: WhatsApp label created, changed, or deleted. This suffix is appended only when webhook-by-event is enabled.
      Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveLabelsEdit
      summary: WhatsApp label created, changed, or deleted
      message:
        $ref: "#/components/messages/LABELS_EDIT"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Labels
  /labels-association:
    description: Label attached to or removed from a chat. This suffix is appended only when webhook-by-event is enabled.
      Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveLabelsAssociation
      summary: Label attached to or removed from a chat
      description: "`type` is add or remove."
      message:
        $ref: "#/components/messages/LABELS_ASSOCIATION"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Labels
  /creds-update:
    description: Baileys credentials changed. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveCredsUpdate
      summary: Baileys credentials changed
      description: For security, Evolution emits instance metadata only; authentication keys are never included.
      message:
        $ref: "#/components/messages/CREDS_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Connection
  /messaging-history-set:
    description: Raw Baileys history synchronization chunk. This suffix is appended only when webhook-by-event is enabled.
      Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessagingHistorySet
      summary: Raw Baileys history synchronization chunk
      message:
        $ref: "#/components/messages/MESSAGING_HISTORY_SET"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: History
  /messaging-history-status:
    description: History synchronization completed or paused. This suffix is appended only when webhook-by-event is enabled.
      Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessagingHistoryStatus
      summary: History synchronization completed or paused
      description: "`status` is complete or paused. `explicit=false` means completion was inferred after no more chunks arrived."
      message:
        $ref: "#/components/messages/MESSAGING_HISTORY_STATUS"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: History
  /lid-mapping-update:
    description: LID-to-phone-number mapping changed. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveLidMappingUpdate
      summary: LID-to-phone-number mapping changed
      message:
        $ref: "#/components/messages/LID_MAPPING_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Identity
  /messages-media-update:
    description: Encrypted media data or media download error changed. This suffix is appended only when webhook-by-event is
      enabled. Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessagesMediaUpdate
      summary: Encrypted media data or media download error changed
      message:
        $ref: "#/components/messages/MESSAGES_MEDIA_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Messages
  /messages-reaction:
    description: Reaction added, changed, or removed. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessagesReaction
      summary: Reaction added, changed, or removed
      description: An empty or missing reaction text means the reaction was removed.
      message:
        $ref: "#/components/messages/MESSAGES_REACTION"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Messages
  /message-receipt-update:
    description: Delivery, read, or played receipt changed. This suffix is appended only when webhook-by-event is enabled.
      Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessageReceiptUpdate
      summary: Delivery, read, or played receipt changed
      message:
        $ref: "#/components/messages/MESSAGE_RECEIPT_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Messages
  /blocklist-set:
    description: Complete blocklist received. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveBlocklistSet
      summary: Complete blocklist received
      message:
        $ref: "#/components/messages/BLOCKLIST_SET"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Privacy
  /blocklist-update:
    description: Contacts added to or removed from blocklist. This suffix is appended only when webhook-by-event is enabled.
      Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveBlocklistUpdate
      summary: Contacts added to or removed from blocklist
      description: "`type` is add or remove."
      message:
        $ref: "#/components/messages/BLOCKLIST_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Privacy
  /newsletter-reaction:
    description: Newsletter reaction count changed. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveNewsletterReaction
      summary: Newsletter reaction count changed
      message:
        $ref: "#/components/messages/NEWSLETTER_REACTION"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Newsletters
  /newsletter-view:
    description: Newsletter message view count changed. This suffix is appended only when webhook-by-event is enabled.
      Without that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveNewsletterView
      summary: Newsletter message view count changed
      message:
        $ref: "#/components/messages/NEWSLETTER_VIEW"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Newsletters
  /newsletter-participants-update:
    description: Newsletter participant role changed. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveNewsletterParticipantsUpdate
      summary: Newsletter participant role changed
      message:
        $ref: "#/components/messages/NEWSLETTER_PARTICIPANTS_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Newsletters
  /newsletter-settings-update:
    description: Newsletter settings changed. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveNewsletterSettingsUpdate
      summary: Newsletter settings changed
      message:
        $ref: "#/components/messages/NEWSLETTER_SETTINGS_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Newsletters
  /message-capping-update:
    description: New-chat message quota changed. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveMessageCappingUpdate
      summary: New-chat message quota changed
      description: "`capping_status`: NONE, FIRST_WARNING, SECOND_WARNING, CAPPED. See schema description for the MV and OTE
        states."
      message:
        $ref: "#/components/messages/MESSAGE_CAPPING_UPDATE"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Limits
  /chats-lock:
    description: Chat lock state changed. This suffix is appended only when webhook-by-event is enabled. Without that
      option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveChatsLock
      summary: Chat lock state changed
      message:
        $ref: "#/components/messages/CHATS_LOCK"
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: 0.3.0
      tags:
        - name: Chats
  /settings-update:
    description: Synced WhatsApp setting changed. This suffix is appended only when webhook-by-event is enabled. Without
      that option, all event messages are POSTed to the configured base URL.
    publish:
      operationId: receiveSettingsUpdate
      summary: Synced WhatsApp setting changed
      description: "`setting` can be unarchiveChats, locale, disableLinkPreviews, timeFormat, privacySettingRelayAllCalls,
        statusPrivacy, notificationActivitySetting, or channelsPersonalisedRecommendation."
      message:
