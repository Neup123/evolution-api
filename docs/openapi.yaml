components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Enter the Evolution API global API key configured as AUTHENTICATION_API_KEY.
  schemas:
    BinaryValue:
      oneOf:
        - type: string
          description: A normal string when the Baileys type permits it.
        - type: object
          properties:
            $base64:
              type: string
              format: byte
          required:
            - $base64
          additionalProperties: false
  parameters:
    ArchiveKey:
      name: x-archive-key
      in: header
      required: true
      description: Separate archive key with the scope required by the operation.
      schema:
        type: string
        format: password
    ArchiveInstance:
      name: instanceName
      in: path
      required: true
      schema:
        type: string
    ArchiveEntityJid:
      name: entityJid
      in: query
      schema:
        type: string
    ArchiveLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
  x-archive-schemas:
    ArchiveStatus:
      type: object
      required:
        - enabled
        - provider
        - accounts
      properties:
        enabled:
          type: boolean
        provider:
          type: string
        accounts:
          type: array
          items:
            type: object
            required:
              - id
              - instanceName
              - lastSequence
              - createdAt
              - updatedAt
              - events
              - media
              - lastCapturedAt
            properties:
              id:
                type: string
                format: uuid
              instanceName:
                type: string
              ownerJid:
                type:
                  - string
                  - "null"
              lastSequence:
                type: string
                pattern: ^\d+$
              headHash:
                type:
                  - string
                  - "null"
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              events:
                type: integer
              media:
                type: integer
              lastCapturedAt:
                type:
                  - string
                  - "null"
                format: date-time
    ArchiveEvent:
      type: object
      required:
        - id
        - accountId
        - instanceName
        - sequence
        - eventType
        - entityType
        - occurredAt
        - capturedAt
        - projection
        - payloadHash
        - recordHash
        - excluded
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
        instanceName:
          type: string
        sequence:
          type: string
          pattern: ^\\d+$
        eventType:
          type: string
        entityType:
          type: string
        entityJid:
          type:
            - string
            - "null"
        messageId:
          type:
            - string
            - "null"
        occurredAt:
          type: string
          format: date-time
        capturedAt:
          type: string
          format: date-time
        projection:
          type: object
          additionalProperties: true
        payload:
          description: Decrypted source data; present only with includePayload and archive:export.
        payloadHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        previousHash:
          type:
            - string
            - "null"
        recordHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        excluded:
          type: boolean
        purgeJobId:
          type:
            - string
            - "null"
    ArchiveMedia:
      type: object
      required:
        - id
        - accountId
        - eventId
        - mediaType
        - state
        - createdAt
      properties:
        id:
          type: string
        accountId:
          type: string
        eventId:
          type: string
        messageId:
          type:
            - string
            - "null"
        entityJid:
          type:
            - string
            - "null"
        mediaType:
          type: string
        mimeType:
          type:
            - string
            - "null"
        objectKey:
          type:
            - string
            - "null"
        contentHash:
          type:
            - string
            - "null"
        sizeBytes:
          type:
            - string
            - "null"
        state:
          type: string
          enum:
            - metadata_only
            - stored
        createdAt:
          type: string
          format: date-time
        purgedAt:
          type:
            - string
            - "null"
          format: date-time
    ArchivePolicyInput:
      type: object
      required:
        - scope
        - policy
      properties:
        id:
          type: string
        scope:
          type: string
          enum:
            - general
            - entity
            - account
            - jid
        selector:
          type: object
          additionalProperties: true
          default: {}
        effectiveAt:
          type: string
          format: date-time
        policy:
          type: object
          properties:
            capture:
              type: object
              additionalProperties:
                type: boolean
            media:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                    - all
                    - images
                    - metadata
                    - none
                types:
                  type: array
                  items:
                    type: string
            directions:
              type: array
              items:
                type: string
                enum:
                  - incoming
                  - outgoing
            retentionDays:
              type:
                - integer
                - "null"
              minimum: 0
            recovery:
              type: object
              properties:
                enabled:
                  type: boolean
                since:
                  type: string
                  format: date-time
    ArchivePolicy:
      allOf:
        - $ref: "#/components/x-archive-schemas/ArchivePolicyInput"
        - type: object
          required:
            - id
            - version
            - enabled
            - createdAt
            - updatedAt
          properties:
            version:
              type: integer
            enabled:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ArchivePurgeCriteria:
      type: object
      minProperties: 1
      properties:
        before:
          type: string
          format: date-time
        entityJid:
          type: string
        groupJid:
          type: string
          pattern: "@g\\\\.us$"
        eventTypes:
          type: array
          minItems: 1
          items:
            type: string
        mediaOnly:
          type: boolean
          default: false
    ArchivePurgeSummary:
      type: object
      required:
        - events
        - media
      properties:
        events:
          type: integer
        media:
          type: integer
        messages:
          type: integer
        messageRevisions:
          type: integer
        receipts:
          type: integer
        reactions:
          type: integer
        entityRevisions:
          type: integer
        memberships:
          type: integer
        calls:
          type: integer
        syncGaps:
          type: integer
        deletedRanges:
          type: array
          description: Signed, content-free hash-chain ranges included only in confirmed purge results and tombstones.
          items:
            type: object
            required:
              - start
              - end
              - previousHash
              - lastHash
            properties:
              start:
                type: string
                pattern: ^\d+$
              end:
                type: string
                pattern: ^\d+$
              previousHash:
                type:
                  - string
                  - "null"
              lastHash:
                type: string
