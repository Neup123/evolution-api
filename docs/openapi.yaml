openapi: 3.1.0
info:
  title: Evolution API – Baileys 7
  version: 4.1.0-baileys-7.0.0-rc14
  description: Typed, grouped HTTP routes for the Baileys WASocket API. Named request fields are generated from the installed Baileys TypeScript declarations. Before using Try it out, click Authorize and enter the Evolution API global API key; Swagger sends it in the apikey header.
servers:
  - url: /
    description: Current Evolution API server
security:
  - ApiKeyAuth: []
tags:
  - name: Registry
    description: Runtime method discovery.
  - name: Instance settings
    description: Per-instance WhatsApp behavior and local database snapshot TTL.
  - name: Webhooks
    description: Instance event delivery configuration, including multiple destinations.
  - name: Archive
    description: Encrypted PostgreSQL WhatsApp archive, policies, integrity, backfill, and preview-confirm purge.
  - name: Communities
    description: Community creation, membership, invitations, and settings.
  - name: Business & catalog
    description: Business profiles, catalogs, collections, and products.
  - name: Calls & messages
    description: Messages, receipts, calls, media, and history.
  - name: Newsletters
    description: Newsletter lifecycle, subscribers, content, and reactions.
  - name: Groups
    description: Group creation, membership, invitations, and settings.
  - name: Account & privacy
    description: Account, presence, profile, privacy, contacts, labels, and quick replies.
  - name: Advanced protocol
    description: Low-level protocol, cryptographic, query, and binary operations.
paths:
  /baileys/methods/{instanceName}:
    get:
      tags:
        - Registry
      summary: List supported Baileys methods and grouped routes
      operationId: listBaileysMethods
      parameters:
        - &a1
          name: instanceName
          in: path
          required: true
          description: Connected Evolution API instance name.
          schema:
            type: string
      responses:
        "200":
          description: Baileys method result. Binary values use the $base64 envelope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /webhook/set-many/{instanceName}:
    post:
      tags:
        - Webhooks
      summary: Replace an instance webhook destination list
      description: Atomically replaces all local webhook destinations for an instance. The legacy /webhook/set route remains available for one destination.
      operationId: setManyWebhooks
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - webhooks
              properties:
                webhooks:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - enabled
                      - url
                    properties:
                      enabled:
                        type: boolean
                        description: Whether this destination receives events.
                      url:
                        type: string
                        format: uri
                        description: HTTPS or HTTP destination URL.
                      events:
                        type: array
                        description: Events to deliver. Omit or pass an empty array to enable every supported event.
                        items:
                          type: string
                          enum:
                            - APPLICATION_STARTUP
                            - QRCODE_UPDATED
                            - MESSAGES_SET
                            - MESSAGES_UPSERT
                            - MESSAGES_EDITED
                            - MESSAGES_UPDATE
                            - MESSAGES_DELETE
                            - MESSAGES_MEDIA_UPDATE
                            - MESSAGES_REACTION
                            - MESSAGE_RECEIPT_UPDATE
                            - SEND_MESSAGE
                            - SEND_MESSAGE_UPDATE
                            - CONTACTS_SET
                            - CONTACTS_UPSERT
                            - CONTACTS_UPDATE
                            - PRESENCE_UPDATE
                            - CHATS_SET
                            - CHATS_UPSERT
                            - CHATS_UPDATE
                            - CHATS_DELETE
                            - CHATS_LOCK
                            - GROUPS_UPSERT
                            - GROUPS_UPDATE
                            - GROUP_PARTICIPANTS_UPDATE
                            - GROUP_JOIN_REQUEST
                            - GROUP_MEMBER_TAG_UPDATE
                            - CONNECTION_UPDATE
                            - CREDS_UPDATE
                            - MESSAGING_HISTORY_SET
                            - MESSAGING_HISTORY_STATUS
                            - LID_MAPPING_UPDATE
                            - BLOCKLIST_SET
                            - BLOCKLIST_UPDATE
                            - NEWSLETTER_REACTION
                            - NEWSLETTER_VIEW
                            - NEWSLETTER_PARTICIPANTS_UPDATE
                            - NEWSLETTER_SETTINGS_UPDATE
                            - MESSAGE_CAPPING_UPDATE
                            - SETTINGS_UPDATE
                            - LABELS_EDIT
                            - LABELS_ASSOCIATION
                            - CALL
                            - TYPEBOT_START
                            - TYPEBOT_CHANGE_STATUS
                            - REMOVE_INSTANCE
                            - LOGOUT_INSTANCE
                            - INSTANCE_CREATE
                            - INSTANCE_DELETE
                            - STATUS_INSTANCE
                      headers:
                        type: object
                        additionalProperties:
                          type: string
                        description: Headers sent to this destination.
                      byEvents:
                        type: boolean
                        description: Append the kebab-case event name to the URL.
                      base64:
                        type: boolean
                        description: Preserve base64 media payloads when supported by the event.
                    additionalProperties: false
              additionalProperties: false
      responses:
        "201":
          description: Saved webhook destinations.
        "400":
          description: Invalid destination configuration.
  /webhook/find-all/{instanceName}:
    get:
      tags:
        - Webhooks
      summary: List an instance webhook destinations
      operationId: listWebhooks
      parameters:
        - *a1
      responses:
        "200":
          description: Webhook destinations.
  /settings/find/{instanceName}:
    get:
      tags:
        - Instance settings
      summary: Get instance behavior and local-read TTL settings
      operationId: findInstanceSettings
      parameters:
        - *a1
      responses:
        "200":
          description: Persisted instance settings.
          content:
            application/json:
              schema: &a2
                type: object
                required:
                  - rejectCall
                  - groupsIgnore
                  - alwaysOnline
                  - readMessages
                  - readStatus
                  - syncFullHistory
                properties:
                  rejectCall:
                    type: boolean
                    description: Reject incoming WhatsApp calls.
                  msgCall:
                    type: string
                    description: Optional message sent when an incoming call is rejected.
                  groupsIgnore:
                    type: boolean
                    description: Ignore incoming messages from groups.
                  alwaysOnline:
                    type: boolean
                    description: Keep the connected account presence online.
                  readMessages:
                    type: boolean
                    description: Automatically mark incoming messages as read.
                  readStatus:
                    type: boolean
                    description: Automatically mark viewed status posts as read.
                  syncFullHistory:
                    type: boolean
                    description: Ask WhatsApp for the available full history during pairing.
                  wavoipToken:
                    type: string
                    description: Optional WA VoIP integration token.
                  localReadTtlSeconds:
                    type:
                      - integer
                      - "null"
                    minimum: 0
                    maximum: 2592000
                    description: Instance default lifetime of local read-through snapshots in seconds; null uses environment defaults.
                  localReadTtlOverrides:
                    type:
                      - object
                      - "null"
                    description: Per-method snapshot lifetimes in seconds. Exact method names override the instance default.
                    additionalProperties:
                      type: integer
                      minimum: 0
                      maximum: 2592000
                additionalProperties: false
  /settings/set/{instanceName}:
    post:
      tags:
        - Instance settings
      summary: Set instance behavior and local-read TTL settings
      operationId: setInstanceSettings
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema: *a2
      responses:
        "201":
          description: Settings persisted for the instance.
  /baileys/communities/communityMetadata/{instanceName}:
    post:
      tags:
        - Communities
      summary: Metadata
      description: Get a parent community name, description, participants, and settings. Use Group Metadata for regular groups. Complete the named fields below. Structured fields accept JSON. JSON request bodies remain supported for API clients.
      operationId: baileys_communityMetadata
      parameters:
        - *a1
        - name: live
          in: query
          required: false
          description: Bypass the local snapshot and query WhatsApp now.
          schema:
            type: boolean
            default: false
        - name: jid
          in: query
          required: true
          description: Parent community JID ending in @g.us. A regular group or subgroup JID is not accepted unless the operation explicitly says otherwise.
          schema:
            type: string
            description: Parent community JID ending in @g.us. A regular group or subgroup JID is not accepted unless the operation explicitly says otherwise.
      responses:
        "200":
          description: Metadata result.
          headers:
            X-Evolution-Data-Source:
              description: local when served from PostgreSQL, live when WhatsApp was queried.
              schema:
                type: string
                enum:
                  - local
                  - live
            X-Evolution-Data-Age:
              description: Age of the local snapshot in seconds. Present only for local responses.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required:
                  - method
                  - result
                properties:
                  method:
                    type: string
                    const: communityMetadata
                    description: Baileys socket method that ran.
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Stable identifier in the namespace implied by its surrounding object.
                      notify:
                        type: string
                        description: string
                      addressingMode:
                        type: string
                        enum:
                          - pn
                          - lid
                        description: "Identifier namespace WhatsApp expects for group addressing: pn or lid."
                      owner:
                        type: string
                        description: Primary owner identifier returned by WhatsApp; it may be a LID.
                      ownerPn:
                        type: string
                        description: Owner phone-number JID when WhatsApp exposes the LID-to-PN mapping.
                      ownerUsername:
                        type: string
                        description: Owner username identifier when WhatsApp exposes one.
                      owner_country_code:
                        type: string
                        description: string
                      subject:
                        type: string
                        description: Human-visible group, community, newsletter, or item title.
                      subjectOwner:
                        type: string
                        description: Identifier of the account that last changed the subject.
                      subjectOwnerPn:
                        type: string
                        description: string
                      subjectOwnerUsername:
                        type: string
                        description: string
                      subjectTime:
                        type: number
                        description: Unix timestamp in seconds when the subject was last changed.
                      creation:
                        type: number
                        description: Unix timestamp in seconds when the entity was created.
                      desc:
                        type: string
                        description: Human-visible description text.
                      descOwner:
                        type: string
                        description: string
                      descOwnerPn:
                        type: string
                        description: string
                      descOwnerUsername:
                        type: string
                        description: string
                      descId:
                        type: string
                        description: WhatsApp identifier of the current description revision.
                      descTime:
                        type: number
                        description: number
                      linkedParent:
                        type: string
                        description: Parent community JID when this group is a community subgroup.
                      restrict:
                        type: boolean
                        description: boolean
                      announce:
                        type: boolean
                        description: boolean
                      memberAddMode:
                        type: boolean
                        description: boolean
                      joinApprovalMode:
                        type: boolean
                        description: boolean
                      isCommunity:
                        type: boolean
                        description: Whether the metadata represents a parent community.
                      isCommunityAnnounce:
                        type: boolean
                        description: Whether this is the default announcements group of a community.
                      size:
                        type: number
                        description: Number of participants or returned items reported by WhatsApp.
                      participants:
                        type: array
                        items:
                          description: GroupParticipant
                        description: Participant records. Identifier namespaces are explained in docs/baileys/identifiers.md.
                      ephemeralDuration:
                        type: number
                        description: number
                      inviteCode:
                        type: string
                        description: string
                      author:
                        type: string
                        description: string
                      authorPn:
                        type: string
                        description: string
                      authorUsername:
                        type: string
                        description: string
                    required:
                      - id
                      - owner
                      - subject
                      - participants
                    additionalProperties: false
                    description: GroupMetadata
                  diagnostics:
                    type: object
                    description: Non-fatal explanation attached when an otherwise successful result is ambiguous.
                    additionalProperties: true
                additionalProperties: false
        "400":
          description: Invalid method parameters or a rejected WhatsApp operation.
